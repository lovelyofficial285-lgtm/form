<!-- Embeddable appointment form. Paste into any site, or host this file as is. -->
<style>
  .lws-form{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:420px;margin:0 auto;padding:24px;border:1px solid #e5e5e5;border-radius:14px;background:#fff;color:#222;box-sizing:border-box}
  .lws-form *{box-sizing:border-box}
  .lws-form h2{margin:0 0 4px;font-size:22px}
  .lws-form p.sub{margin:0 0 18px;color:#666;font-size:14px}
  .lws-form label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  .lws-form input[type=text],.lws-form input[type=email],.lws-form input[type=tel],.lws-form select{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px;background:#fff;color:#222}
  .lws-form input:focus,.lws-form select:focus{outline:2px solid #222;outline-offset:1px}
  .lws-form .hint{font-size:12px;color:#777;margin-top:4px}
  .lws-form .check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;line-height:1.4}
  .lws-form .check input{margin-top:3px;width:18px;height:18px;flex:none}
  .lws-form button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#222;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .lws-form button:disabled{opacity:.6;cursor:wait}
  .lws-form .msg{margin-top:14px;font-size:14px;text-align:center}
  .lws-form .ok{color:#1a7f37}
  .lws-form .err{color:#c62828}
  .lws-form .hp{position:absolute;left:-9999px;opacity:0}
</style>

<form class="lws-form" id="lwsForm" novalidate>
  <h2>Book your appointment</h2>
  <p class="sub">Fill in your details and we’ll get back to you.</p>

  <label for="lwsName">Name</label>
  <input type="text" id="lwsName" name="name" autocomplete="name" required>

  <label for="lwsEmail">Email</label>
  <input type="email" id="lwsEmail" name="email" autocomplete="email" required>

  <label for="lwsPhone">Phone number</label>
  <input type="tel" id="lwsPhone" name="phone" autocomplete="tel" required>
  <div class="hint">Your WhatsApp number works best.</div>

  <label for="lwsTreatment">Treatment</label>
  <select id="lwsTreatment" name="treatment" required>
    <option value="">Select a treatment</option>
    <option>Haircut</option>
    <option>Colour</option>
    <option>Blow dry</option>
    <option>Nails</option>
    <option>Facial</option>
    <option>Other</option>
  </select>

  <div class="check">
    <input type="checkbox" id="lwsOffers" name="offers" value="Yes">
    <label for="lwsOffers" style="margin:0;font-weight:400">Yes, I’d like to receive discount offers and notifications from us.</label>
  </div>

  <!-- spam trap: real people never see or fill this -->
  <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

  <button type="submit" id="lwsBtn">Submit</button>
  <div class="msg" id="lwsMsg" role="status"></div>
</form>

<script>
  // PASTE your Apps Script Web App URL here (ends with /exec)
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyfST3S-KvcVzN3tiiKspU991qgRdmhCZm5PMHz2bKFCe2ES2HxcDltqwHZ4IA0d6M/exec';

  var form = document.getElementById('lwsForm');
  var btn  = document.getElementById('lwsBtn');
  var msg  = document.getElementById('lwsMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = '';

    var d = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim(),
      treatment: form.treatment.value,
      offers: form.offers.checked ? 'Yes' : 'No',
      website: form.website.value
    };

    if (!d.name || !d.email || !d.phone || !d.treatment) {
      msg.className = 'msg err';
      msg.textContent = 'Please fill in all fields.';
      return;
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) {
      msg.className = 'msg err';
      msg.textContent = 'Please enter a valid email.';
      return;
    }
    if (d.phone.replace(/\D/g, '').length < 7) {
      msg.className = 'msg err';
      msg.textContent = 'Please enter a valid phone number.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      body: new URLSearchParams(d)
    }).then(function () {
      form.reset();
      msg.className = 'msg ok';
      msg.textContent = 'Thank you! We’ve received your request. Check your email.';
    }).catch(function () {
      msg.className = 'msg err';
      msg.textContent = 'Something went wrong. Please try again.';
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = 'Submit';
    });
  });
</script>
